
<app-header></app-header>


<ion-content>
  <ion-card *ngFor="let c of crops">
    <img src="https://ionicframework.com/docs/img/demos/card-media.png" />
    <ion-card-header>
      <ion-card-title>{{c.name}} - ₹{{c.price}}/kg</ion-card-title>
      <ion-card-subtitle>
        <ion-badge color="success"><ion-icon name="call-outline"></ion-icon></ion-badge>
        <span>Ramesh Kumar - Farmer</span>
      </ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <span style="opacity: 0.5;">Qty: {{c.quantity}},</span>
      <span style="opacity: 0.5; margin-left:20px;">Location: {{c.location}}</span>
    </ion-card-content>
    
  </ion-card>
</ion-content>
