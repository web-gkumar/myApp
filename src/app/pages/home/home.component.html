<ion-header><ion-toolbar><ion-title>Crop Feed</ion-title></ion-toolbar></ion-header>
<ion-content>
  <ion-card *ngFor="let c of crops">
    <ion-card-header>
      <ion-card-title>{{c.name}}</ion-card-title>
      <ion-card-subtitle>₹{{c.price}}/kg</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>Qty: {{c.quantity}}</p>
      <p>Location: {{c.location}}</p>
    </ion-card-content>
  </ion-card>
</ion-content>
