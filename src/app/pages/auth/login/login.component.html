<ion-content class="auth-bg">
  <div class="auth-card">
    <h2>Welcome Back 🌾</h2>
    <p>Login to continue</p>
    <form [formGroup]="loginForm">
      <ion-list>
        <ion-item>
          <ion-input labelPlacement="floating" type="number" maxlength="10" formControlName="mobile" placeholder="Mobile">
            <div slot="label">Mobile <ion-text color="danger">*</ion-text></div>
          </ion-input>
        </ion-item>
        <!-- <ion-text color="danger" *ngIf="loginForm.get('mobile')?.touched && loginForm.get('mobile')?.invalid"><small>Enter valid 10 digit mobile number</small></ion-text> -->
        <ion-item *ngIf="otpSent">
          <ion-input labelPlacement="floating" type="number" formControlName="otp" placeholder="Enter OTP"><div slot="label">OTP <ion-text color="danger">*</ion-text></div></ion-input>
        </ion-item>
        <ion-text color="danger" *ngIf="otpSent && loginForm.get('otp')?.touched && loginForm.get('otp')?.invalid"><small>Invalid OTP</small></ion-text>
      </ion-list>
      <ion-button expand="block" *ngIf="!otpSent" [disabled]="loginForm.get('mobile')?.invalid" (click)="sendOtp()">Send OTP</ion-button>
      <ion-button expand="block" color="success" *ngIf="otpSent" [disabled]="loginForm.get('otp')?.invalid" (click)="verifyOtp()">Verify & Login</ion-button>
    </form>
    <p class="link">Don’t have an account? <span routerLink="/register">Register</span></p>
  </div>
</ion-content>
